<!DOCTYPE html>
<html lang="my,en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e2e8f0">
<title>Admin Dashboard - AI Studio Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Padauk', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: #e2e8f0;
  color: #0f172a;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Navbar */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  background-color: #ffffff;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 2px solid #d97706;
}

.nav-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.back-btn {
  text-decoration: none;
  background: #fef3c7;
  color: #b45309;
  padding: 5px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  border: 1px solid #fde68a;
}

.logo {
  font-size: 1.1rem;
  font-weight: bold;
  color: #b45309;
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn {
  border: none;
  padding: 6px 14px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-gold {
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(217, 119, 6, 0.25);
}

.btn-danger {
  background: #fee2e2;
  color: #dc2626;
  border: 1px solid #fecaca;
}

/* Main Container */
.container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 24px 16px 40px;
  width: 100%;
  flex: 1;
}

/* Auth / Access Message Box */
.status-card {
  background: #ffffff;
  border: 1px solid #cbd5e1;
  border-radius: 16px;
  padding: 32px 20px;
  text-align: center;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
  margin-top: 20px;
}

.status-card h3 {
  font-size: 1.25rem;
  color: #0f172a;
  margin-bottom: 8px;
}

.status-card p {
  font-size: 0.9rem;
  color: #64748b;
  margin-bottom: 20px;
}

/* Dashboard Content */
#dashboardContent {
  display: none;
}

.stats-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  background: rgba(255, 255, 255, 0.75);
  backdrop-filter: blur(12px);
  padding: 16px 20px;
  border-radius: 16px;
  margin-bottom: 20px;
  border: 1px solid #ffffff;
  box-shadow: 0 6px 20px rgba(31, 38, 135, 0.06);
}

.stat-item {
  display: flex;
  align-items: center;
  gap: 12px;
}

.stat-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: #fffbeb;
  border: 1px solid #fde68a;
  display: grid;
  place-items: center;
  font-size: 20px;
}

.stat-info h4 {
  font-size: 12px;
  color: #64748b;
}

.stat-info span {
  font-size: 20px;
  font-weight: 700;
  color: #b45309;
}

.search-box {
  padding: 8px 14px;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  font-size: 13px;
  outline: none;
  min-width: 220px;
}

.search-box:focus {
  border-color: #f59e0b;
}

/* User Table */
.table-card {
  background: #ffffff;
  border-radius: 16px;
  border: 1px solid #cbd5e1;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 600px;
}

th, td {
  padding: 14px 16px;
  text-align: left;
  border-bottom: 1px solid #f1f5f9;
  font-size: 13px;
}

th {
  background: #f8fafc;
  color: #475569;
  font-weight: 700;
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.5px;
}

tr:hover {
  background-color: #fffbeb;
}

.user-cell {
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid #f59e0b;
}

.user-name {
  font-weight: 700;
  color: #0f172a;
}

.uid-badge {
  background: #f1f5f9;
  color: #475569;
  padding: 3px 8px;
  border-radius: 6px;
  font-family: monospace;
  font-size: 11px;
}

.time-text {
  color: #64748b;
  font-size: 12px;
}

.delete-btn {
  background: #fee2e2;
  color: #dc2626;
  border: 1px solid #fecaca;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}

.delete-btn:hover {
  background: #dc2626;
  color: #ffffff;
}
</style>
</head>
<body>

<header class="navbar">
  <div class="nav-left">
    <a href="index.html" class="back-btn">← ပင်မစာမျက်နှာ</a>
    <div class="logo">🛡️ Admin Panel</div>
  </div>
  <div class="nav-right">
    <button class="btn btn-gold" id="adminLoginBtn" style="display: none;">🔑 Admin Login</button>
    <button class="btn btn-danger" id="adminLogoutBtn" style="display: none;">ထွက်မည်</button>
  </div>
</header>

<main class="container">

  <!-- State 1: Checking / Login Required / Access Denied -->
  <div class="status-card" id="statusBox">
    <h3 id="statusTitle">စစ်ဆေးနေပါသည်...</h3>
    <p id="statusDesc">Admin အချက်အလက်များကို စစ်ဆေးနေပါသဖြင့် ခေတ္တစောင့်ဆိုင်းပေးပါ။</p>
  </div>

  <!-- State 2: Admin Dashboard (Visible only to Admin) -->
  <div id="dashboardContent">
    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-icon">👥</div>
        <div class="stat-info">
          <h4>စုစုပေါင်း အသုံးပြုသူ (Total Users)</h4>
          <span id="totalUsersCount">0</span>
        </div>
      </div>

      <div style="display: flex; gap: 8px; align-items: center;">
        <input type="text" id="searchInput" class="search-box" placeholder="နာမည် သို့မဟုတ် Email ရှာရန်...">
        <button class="btn btn-gold" id="refreshBtn">🔄 Refresh</button>
      </div>
    </div>

    <div class="table-card">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>အသုံးပြုသူ (User)</th>
              <th>အီးမေးလ် (Email)</th>
              <th>နောက်ဆုံးဝင်ချိန် (Last Login)</th>
              <th>User ID</th>
              <th>လုပ်ဆောင်ချက်</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <tr><td colspan="5" style="text-align:center;">အချက်အလက်များ ဆွဲယူနေပါသည်...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDoDB5EV3HogihQXmhk0CsIJxvnnjFWmpc",
    authDomain: "ai-studio-nlo.firebaseapp.com",
    projectId: "ai-studio-nlo",
    storageBucket: "ai-studio-nlo.firebasestorage.app",
    messagingSenderId: "904606018542",
    appId: "1:904606018542:web:7de09d3d406dd5d586fcff",
    measurementId: "G-0JL94QP83K"
  };

  // ဝင်ရောက်ခွင့်ပြုမည့် Admin Gmail စာရင်း (လိုအပ်ပါက ထပ်တိုးနိုင်သည်)
  const ADMIN_EMAILS = [
    "nainelinnoo@gmail.com"
  ];

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  const statusBox = document.getElementById("statusBox");
  const statusTitle = document.getElementById("statusTitle");
  const statusDesc = document.getElementById("statusDesc");
  const dashboardContent = document.getElementById("dashboardContent");
  const adminLoginBtn = document.getElementById("adminLoginBtn");
  const adminLogoutBtn = document.getElementById("adminLogoutBtn");
  const userTableBody = document.getElementById("userTableBody");
  const totalUsersCount = document.getElementById("totalUsersCount");
  const searchInput = document.getElementById("searchInput");
  const refreshBtn = document.getElementById("refreshBtn");

  let allUsersData = [];

  // Admin Login
  adminLoginBtn.addEventListener("click", async () => {
    try {
      await signInWithPopup(auth, provider);
    } catch (err) {
      alert("Login Error: " + err.message);
    }
  });

  // Admin Logout
  adminLogoutBtn.addEventListener("click", () => signOut(auth));

  // Refresh Data
  refreshBtn.addEventListener("click", loadUsers);

  // Check Auth State & Admin Permission
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      statusBox.style.display = "block";
      dashboardContent.style.display = "none";
      adminLoginBtn.style.display = "inline-block";
      adminLogoutBtn.style.display = "none";
      statusTitle.textContent = "🔒 Admin Login လိုအပ်ပါသည်";
      statusDesc.textContent = "User စာရင်းများကို ကြည့်ရှုရန် ညာဘက်အပေါ်ထောင့်ရှိ Admin Login ခလုတ်ဖြင့် ဝင်ရောက်ပါ။";
      return;
    }

    adminLoginBtn.style.display = "none";
    adminLogoutBtn.style.display = "inline-block";

    // Check if logged-in email is in ADMIN_EMAILS list
    const userEmail = (user.email || "").toLowerCase();
    const isAllowed = ADMIN_EMAILS.some(email => email.toLowerCase() === userEmail);

    if (isAllowed) {
      statusBox.style.display = "none";
      dashboardContent.style.display = "block";
      loadUsers();
    } else {
      statusBox.style.display = "block";
      dashboardContent.style.display = "none";
      statusTitle.textContent = "⛔ ဝင်ရောက်ခွင့် မရှိပါ (Access Denied)";
      statusDesc.textContent = `သင့်အကောင့် (${user.email}) သည် Admin ခွင့်ပြုချက် မရှိပါ။`;
    }
  });

  // Fetch Users from Firestore
  async function loadUsers() {
    userTableBody.innerHTML = `<tr><td colspan="5" style="text-align:center;">အချက်အလက်များ ဆွဲယူနေပါသည်...</td></tr>`;
    try {
      const snap = await getDocs(collection(db, "users"));
      allUsersData = [];

      snap.forEach((docSnap) => {
        allUsersData.push({ id: docSnap.id, ...docSnap.data() });
      });

      // နောက်ဆုံးဝင်သည့် အချိန်အလိုက် အပေါ်ဆုံးမှ စီရန်
      allUsersData.sort((a, b) => {
        const timeA = a.lastLogin?.seconds || 0;
        const timeB = b.lastLogin?.seconds || 0;
        return timeB - timeA;
      });

      totalUsersCount.textContent = allUsersData.length;
      renderTable(allUsersData);
    } catch (error) {
      console.error("Error loading users:", error);
      userTableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#dc2626;">Error: ${error.message}</td></tr>`;
    }
  }

  // Render Table Rows
  function renderTable(users) {
    if (users.length === 0) {
      userTableBody.innerHTML = `<tr><td colspan="5" style="text-align:center;">အသုံးပြုသူ စာရင်း မရှိသေးပါ။</td></tr>`;
      return;
    }

    userTableBody.innerHTML = "";
    users.forEach((u) => {
      let formattedTime = "မသိရပါ";
      if (u.lastLogin && u.lastLogin.seconds) {
        const date = new Date(u.lastLogin.seconds * 1000);
        formattedTime = date.toLocaleString("en-GB", {
          day: "2-digit", month: "short", year: "numeric",
          hour: "2-digit", minute: "2-digit", hour12: true
        });
      }

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>
          <div class="user-cell">
            <img src="${u.photoURL || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="avatar" alt="Avatar">
            <span class="user-name">${u.name || 'Unknown'}</span>
          </div>
        </td>
        <td>${u.email || '-'}</td>
        <td><span class="time-text">${formattedTime}</span></td>
        <td><span class="uid-badge">${u.uid || u.id}</span></td>
        <td>
          <button class="delete-btn" data-id="${u.id}" data-name="${u.name || 'User'}">ဖျက်မည်</button>
        </td>
      `;
      userTableBody.appendChild(tr);
    });

    // Attach Delete Buttons Event
    document.querySelectorAll(".delete-btn").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        const docId = e.target.getAttribute("data-id");
        const name = e.target.getAttribute("data-name");
        if (confirm(`"${name}" ၏ မှတ်တမ်းကို Database မှ ဖျက်ရန် သေချာပါသလား?`)) {
          try {
            await deleteDoc(doc(db, "users", docId));
            loadUsers();
          } catch (err) {
            alert("ဖျက်၍မရပါ: " + err.message);
          }
        }
      });
    });
  }

  // Search Filter
  searchInput.addEventListener("input", (e) => {
    const keyword = e.target.value.toLowerCase().trim();
    const filtered = allUsersData.filter(u =>
      (u.name && u.name.toLowerCase().includes(keyword)) ||
      (u.email && u.email.toLowerCase().includes(keyword)) ||
      (u.uid && u.uid.toLowerCase().includes(keyword))
    );
    renderTable(filtered);
  });
</script>

</body>
</html>
