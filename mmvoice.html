<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>မြန်မာစာ အသံပြောင်းစနစ်</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1a1a1a;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* အပေါ်ဆုံး ခေါင်းစဉ် (Blue Heading) */
    .header-title {
      color: #1a73e8;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-label {
      font-size: 18px;
      font-weight: 600;
      color: #202124;
    }

    /* စာသားရိုက်ရန် Textarea */
    .text-input {
      width: 100%;
      height: 160px;
      padding: 14px;
      border: 1px solid #dadce0;
      border-radius: 12px;
      font-size: 16px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      font-family: inherit;
    }

    .text-input:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
    }

    /* Dropdown Menus */
    .select-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dadce0;
      border-radius: 10px;
      font-size: 15px;
      background-color: #f1f3f4;
      color: #202124;
      outline: none;
      cursor: pointer;
    }

    /* အပြာရောင် Button */
    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: #1a73e8;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 6px;
    }

    .submit-btn:hover {
      background-color: #1557b0;
    }

    .submit-btn:disabled {
      background-color: #a8c7fa;
      cursor: not-allowed;
    }

    /* Status & Error Message */
    .status-msg {
      font-size: 14px;
      line-height: 1.5;
      min-height: 20px;
    }

    .status-msg.error {
      color: #d93025;
      font-weight: 500;
    }

    .status-msg.success {
      color: #188038;
      font-weight: 500;
    }

    .status-msg.loading {
      color: #1a73e8;
    }

    /* Audio Player */
    .audio-player {
      width: 100%;
      margin-top: 4px;
      outline: none;
    }
  </style>
</head>
<body>

  <main class="container">
    <h1 class="header-title">ပြောင်းစနစ်</h1>

    <!-- စာသားထည့်သွင်းရန် အပိုင်း -->
    <div class="field-group">
      <label class="field-label" for="ttsText">မြန်မာစာသား ထည့်သွင်းပါ</label>
      <textarea id="ttsText" class="text-input" placeholder="စာသား ရိုက်ထည့်ပါ...">မင်္ဂလာပါ။ မြန်မာစာကို အသံအဖြစ် ပြောင်းလဲနိုင်ပါသည်။</textarea>
    </div>

    <!-- Voice ရွေးချယ်မှု -->
    <div class="field-group">
      <label class="field-label" for="voiceSelect">Voice</label>
      <select id="voiceSelect" class="select-input">
        <option value="my-MM-ThihaNeural" selected>သီဟ (Thiha - Male)</option>
        <option value="my-MM-NilarNeural">နီလာ (Nilar - Female)</option>
      </select>
    </div>

    <!-- Speed / Rate ရွေးချယ်မှု -->
    <div class="field-group">
      <label class="field-label" for="rateSelect">အမြန်နှုန်း (Rate)</label>
      <select id="rateSelect" class="select-input">
        <option value="-20%">Slow (-20%)</option>
        <option value="+0%" selected>Normal (0%)</option>
        <option value="+20%">Fast (+20%)</option>
      </select>
    </div>

    <!-- ခလုတ် -->
    <button id="generateBtn" class="submit-btn" type="button">အသံဖန်တီးရန်</button>

    <!-- Error/Status စာသားပြသရန် -->
    <div id="statusMessage" class="status-msg"></div>

    <!-- Audio Player -->
    <audio id="audioElement" class="audio-player" controls preload="none"></audio>
  </main>

  <script>
    const textInput = document.getElementById("ttsText");
    const voiceSelect = document.getElementById("voiceSelect");
    const rateSelect = document.getElementById("rateSelect");
    const generateBtn = document.getElementById("generateBtn");
    const statusMsg = document.getElementById("statusMessage");
    const audioElement = document.getElementById("audioElement");

    let currentBlobUrl = null;

    generateBtn.addEventListener("click", async () => {
      const text = textInput.value.trim();

      if (!text) {
        statusMsg.className = "status-msg error";
        statusMsg.textContent = "❌ အမှား: ကျေးဇူးပြု၍ မြန်မာစာသား ထည့်သွင်းပေးပါ။";
        return;
      }

      // UI Loading အခြေအနေ ပြောင်းလဲခြင်း
      generateBtn.disabled = true;
      generateBtn.textContent = "လုပ်ဆောင်နေပါသည်...";
      statusMsg.className = "status-msg loading";
      statusMsg.textContent = "အသံဖန်တီးနေပါသည်... ခေတ္တစောင့်ဆိုင်းပေးပါ။";

      try {
        // Backend API ခေါ်ယူခြင်း (Render Domain သို့မဟုတ် Same Domain အားလုံးနှင့် အဆင်ပြေစေရန် Relative Path သုံးထားပါသည်) [2]
        const response = await fetch("/api/tts", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            text: text,
            voice: voiceSelect.value,
            rate: rateSelect.value,
            pitch: "+0Hz"
          })
        });

        if (!response.ok) {
          let errorDetail = "Speech synthesis failed.";
          try {
            const errJson = await response.json();
            errorDetail = errJson.details || errJson.error || errorDetail;
          } catch (_) {
            errorDetail = await response.text();
          }
          throw new Error(errorDetail);
        }

        // အသံဖိုင် Blob ရယူခြင်း
        const audioBlob = await response.blob();

        if (currentBlobUrl) {
          URL.revokeObjectURL(currentBlobUrl);
        }

        currentBlobUrl = URL.createObjectURL(audioBlob);
        audioElement.src = currentBlobUrl;
        audioElement.load();
        
        statusMsg.className = "status-msg success";
        statusMsg.textContent = "✅ အသံဖိုင် ဖန်တီးပြီးပါပြီ။";

        // Auto Play
        await audioElement.play().catch(() => {});

      } catch (err) {
        console.error("TTS Synthesis Error:", err);
        statusMsg.className = "status-msg error";
        statusMsg.textContent = `❌ အမှား: ${err.message || "Speech synthesis failed."}`;
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = "အသံဖန်တီးရန်";
      }
    });
  </script>
</body>
</html>
