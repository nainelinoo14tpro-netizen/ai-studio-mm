<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Clone & Myanmar TTS - AI Studio MM</title>
    <!-- Gradio Client JS Library -->
    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
        window.GradioClient = Client;
    </script>
    <style>
        :root {
            --bg: #090d16;
            --panel: #131a29;
            --border: #232d42;
            --cyan: #38bdf8;
            --text: #f1f5f9;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }
        
        .container { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; width: 100%; max-width: 520px; padding: 22px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); position: relative; margin-top: 15px; }
        
        /* Top Navigation Bar */
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .back-link { color: var(--cyan); text-decoration: none; font-size: 13.5px; display: flex; align-items: center; gap: 6px; }
        .menu-trigger-btn { background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border); color: #fff; border-radius: 10px; padding: 7px 12px; font-size: 12px; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: 0.2s; }
        .menu-trigger-btn:hover { background: rgba(255, 255, 255, 0.12); }

        h1 { font-size: 20px; margin-bottom: 16px; color: var(--cyan); display: flex; align-items: center; gap: 8px; }
        
        .mode-tabs { display: flex; gap: 10px; margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .tab-btn { background: transparent; border: none; color: var(--muted); font-size: 13.5px; font-weight: bold; cursor: pointer; padding: 8px 14px; border-radius: 8px; transition: 0.2s; }
        .tab-btn.active { color: #fff; background: #0284c7; }

        label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
        input[type="file"], select, textarea { width: 100%; background: #090d16; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: #fff; font-size: 14px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--cyan); }
        textarea { height: 110px; resize: vertical; }

        .btn-gen { width: 100%; margin-top: 20px; padding: 13px; border-radius: 10px; border: none; background: #0284c7; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-gen:hover { background: #0369a1; }
        .btn-gen:disabled { background: #475569; cursor: not-allowed; }

        .status-box { margin-top: 15px; font-size: 13px; color: var(--cyan); text-align: center; }
        audio { width: 100%; margin-top: 16px; border-radius: 8px; }

        /* ================= POPUP MODAL MENU ================= */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 16px; }
        .modal-box { background: #111827; border: 1px solid #283548; border-radius: 20px; width: 100%; max-width: 440px; padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 12px; }
        .modal-title { font-size: 15px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .close-btn { background: rgba(255, 255, 255, 0.08); border: none; color: #fff; width: 28px; height: 28px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        
        .apps-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .app-item { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 14px; padding: 14px; text-decoration: none; color: inherit; text-align: center; display: flex; flex-direction: column; align-items: center; transition: 0.2s; }
        .app-item:hover { background: rgba(255, 255, 255, 0.08); transform: translateY(-3px); }
        .app-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; margin-bottom: 10px; }
        .icon-recap { background: linear-gradient(135deg, #ff5572, #ff7e40); }
        .icon-story { background: linear-gradient(135deg, #ffbe3b, #ff5572); }
        .icon-video { background: linear-gradient(135deg, #2bd576, #20d7ff); }
        .icon-home { background: linear-gradient(135deg, #6366f1, #a855f7); }
        
        .app-name { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 3px; }
        .app-desc { font-size: 10.5px; color: var(--muted); }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <a href="index.html" class="back-link">← ပင်မစာမျက်နှာသို့ ပြန်သွားမည်</a>
        <button class="menu-trigger-btn" onclick="openMenu()">✦ AI Apps Menu</button>
    </div>

    <h1>🎙️ Voice Clone & Myanmar TTS</h1>

    <div class="mode-tabs">
        <button type="button" class="tab-btn active" id="tabClone" onclick="switchMode('clone')">🎤 Voice Clone</button>
        <button type="button" class="tab-btn" id="tabPrompt" onclick="switchMode('prompt')">✨ AI Voice Styles</button>
    </div>

    <label>ပြောစေလိုသော မြန်မာ/အင်္ဂလိပ် စာသား (Text):</label>
    <textarea id="ttsText" placeholder="ဒီနေရာမှာ အသံထွက်စေလိုသော စာသားကို ရိုက်ထည့်ပါ..."></textarea>

    <!-- Voice Clone Section -->
    <div id="cloneSection">
        <label>Clone လုပ်မည့် အသံဖိုင် (Audio Reference):</label>
        <input type="file" id="audioFile" accept="audio/*">

        <label>အသံဖိုင်ထဲမှ မူရင်းပြောစကား (Reference Text):</label>
        <textarea id="refText" style="height: 65px;" placeholder="တင်ထားသော အသံဖိုင်ထဲတွင် ပြောထားသည့် စာသားကို အတိအကျ ထည့်ပါ..."></textarea>
    </div>

    <!-- AI Styles Section -->
    <div id="promptSection" style="display: none;">
        <label>အသံစတိုင် ရွေးချယ်ပါ (Voice Style):</label>
        <select id="voiceStyle">
            <option value="A young male voice, calm and clear, medium pace, deep tone">🧑 လူငယ်အမျိုးသားသံ (တည်ငြိမ်ပြတ်သား)</option>
            <option value="A young female voice, crystal clear, professional and articulate, confident tone">👩 လူငယ်အမျိုးသမီးသံ (ကြည်လင်ပြတ်သား)</option>
            <option value="A news anchor voice, formal and authoritative, steady pace, perfect for broadcast">📰 သတင်းကြေညာသူအသံ (လေးနက်တည်ငြိမ်)</option>
            <option value="A storyteller voice, dramatic and expressive, slow pace, rich and warm tone">📖 ပုံပြင်/ဇာတ်လမ်းပြောသူအသံ (ရသစုံ)</option>
            <option value="A cheerful host voice, energetic and friendly, fast pace, bright and engaging">😄 ရွှင်လန်းတက်ကြွသော တင်ဆက်သူအသံ</option>
        </select>
    </div>

    <button id="genBtn" class="btn-gen" onclick="generateVoice()">Generate Voice</button>

    <div id="status" class="status-box"></div>
    <audio id="audioOut" controls style="display: none;"></audio>
</div>

<!-- ================= AI STUDIO APPS MODAL ================= -->
<div class="modal-overlay" id="menuModal" onclick="closeMenuOnOutside(event)">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">✦ AI Studio Apps</div>
            <button class="close-btn" onclick="closeMenu()">✕</button>
        </div>
        <div class="apps-grid">
            <a href="movie-recaps.html" class="app-item">
                <div class="app-icon icon-recap">🎬</div>
                <div class="app-name">Movie Recaps</div>
                <div class="app-desc">ဇာတ်ကြောင်းပြော & မြန်မာ Voice</div>
            </a>
            <a href="story-maker.html" class="app-item">
                <div class="app-icon icon-story">📝</div>
                <div class="app-name">Story Maker</div>
                <div class="app-desc">ခေါင်းစဉ်ဖြင့် AI ဇာတ်လမ်းရေး</div>
            </a>
            <a href="story-to-video.html" class="app-item">
                <div class="app-icon icon-video">🎥</div>
                <div class="app-name">Story to Video</div>
                <div class="app-desc">Photo Slideshow & Prompts</div>
            </a>
                        <a href="voice-clone.html" class="app-item" style="border: 1px solid rgba(168, 85, 247, 0.4); background: rgba(168, 85, 247, 0.08);">
                <div class="app-icon" style="background: linear-gradient(135deg, #a855f7, #6366f1);">🎙️</div>
                <div class="app-name">Voice Clone</div>
                <div class="app-desc">မြန်မာ TTS & Voice Clone</div>
            </a>

            <a href="index.html" class="app-item" style="grid-column: span 2;">

                <div class="app-icon icon-home">🏠</div>
                <div class="app-name">Main Hub</div>
                <div class="app-desc">ပင်မစာမျက်နှာ Dashboard သို့</div>
            </a>
        </div>
    </div>
</div>

<script>
let currentMode = 'clone';

// Page စတင်ဖွင့်ချိန်တွင် တခြား Page များ (Story Maker / Movie Recaps) မှ ပို့လိုက်သော Text ပါလာပါက Auto-fill ဖြည့်ပေးခြင်း
window.addEventListener("DOMContentLoaded", () => {
    const passedText = localStorage.getItem("transfer_script_text");
    if (passedText) {
        document.getElementById('ttsText').value = passedText;
        localStorage.removeItem("transfer_script_text"); // တခါသုံးပြီး ရှင်းထုတ်ခြင်း
    }
});

function openMenu() {
    document.getElementById('menuModal').style.display = 'flex';
}
function closeMenu() {
    document.getElementById('menuModal').style.display = 'none';
}
function closeMenuOnOutside(e) {
    if (e.target.id === 'menuModal') closeMenu();
}

function switchMode(mode) {
    currentMode = mode;
    document.getElementById('cloneSection').style.display = mode === 'clone' ? 'block' : 'none';
    document.getElementById('promptSection').style.display = mode === 'prompt' ? 'block' : 'none';
    document.getElementById('tabClone').className = mode === 'clone' ? 'tab-btn active' : 'tab-btn';
    document.getElementById('tabPrompt').className = mode === 'prompt' ? 'tab-btn active' : 'tab-btn';
}

async function generateVoice() {
    const text = document.getElementById('ttsText').value.trim();
    const status = document.getElementById('status');
    const audioOut = document.getElementById('audioOut');
    const btn = document.getElementById('genBtn');

    if (!text) {
        alert("ကျေးဇူးပြု၍ ပြောစေလိုသော စာသား ရိုက်ထည့်ပါ");
        return;
    }

    let payload = {};
    let endpoint = "";

    if (currentMode === 'clone') {
        const file = document.getElementById('audioFile').files[0];
        const refText = document.getElementById('refText').value.trim();

        if (!file) {
            alert("Clone ပြုလုပ်ရန် နမူနာ အသံဖိုင် တင်ပေးပါ");
            return;
        }
        if (!refText) {
            alert("အသံဖိုင်ထဲတွင် ပါဝင်သော မူရင်းစာသား (Reference Text) ကို ထည့်ပေးပါ");
            return;
        }

        endpoint = "/clone";
        payload = {
            text_input: text,
            uploaded_audio: file,
            reference_text: refText
        };
    } else {
        const style = document.getElementById('voiceStyle').value;
        endpoint = "/prompt_voice";
        payload = {
            text_input: text,
            style_prompt: style
        };
    }

    btn.disabled = true;
    audioOut.style.display = "none";
    status.innerText = "⏳ ZeroGPU သို့ ချိတ်ဆက်၍ အသံဖန်တီးနေပါသည်... စောင့်ပေးပါ...";

    try {
        const client = await window.GradioClient.connect("nlopro/clone-burmese-tts");
        const result = await client.predict(endpoint, payload);

        const audioUrl = result.data[0].url;
        audioOut.src = audioUrl;
        audioOut.style.display = "block";
        status.innerText = "✅ အသံထုတ်လုပ်မှု အောင်မြင်ပါသည်!";
    } catch (e) {
        console.error(e);
        status.innerText = "❌ အမှားဖြစ်သွားပါသည်: " + (e.message || "ပြန်လည်ကြိုးစားကြည့်ပါ");
    } finally {
        btn.disabled = false;
    }
}
</script>
</body>
</html>
